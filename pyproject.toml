[project]
name = "ai4tm"
version = "0.1.0"
description = "Local environment for the AI for Marketing masterclass notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "ipywidgets>=8.0.0",
    "ipykernel",
    "requests>=2.31.0",
    "plotly>=5.14.0",
    "networkx>=3.1",
    "neo4j>=5.0.0",
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "synthcity",
    "opacus<1.5",
    "kaleido",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "nbformat",
    "huggingface_hub",
    "xgboost",
]

[tool.uv]
package = false
